<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Creator OS is offline</title>
    <style>
      body{font-family:system-ui,sans-serif;background:#0d0f17;color:#e8eaf4;display:grid;min-height:100vh;place-items:center;margin:0;padding:24px;text-align:center}
      main{max-width:26rem}
      button{margin-top:16px;padding:10px 18px;border-radius:10px;border:0;background:#8b8bff;color:#0d0f17;font-weight:600;font-size:15px}
      p{color:#98a0c0;line-height:1.5}
    </style>
  </head>
  <body>
    <main>
      <h1>Creator OS can't be reached</h1>
      <p>Your device is offline, or the machine running Creator OS is asleep or restarting. Nothing is lost — your data lives on that machine.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
