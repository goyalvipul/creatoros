function bottom(){let items=[['today','⌂','Today'],['content','✦','Content'],['projects','▦','Projects'],['publishing','↗','Publish'],['more','⊞','More']];return `<nav class="mobile-bottom">${items.map(n=>`<button class="bottom-item ${(S.page===n[0]||(n[0]==='more'&&!items.slice(0,4).some(z=>z[0]===S.page)))?'active':''}" ${n[0]==='more'?'data-nav="more"':`data-nav="${n[0]}"`}><span class="glyph">${n[1]}</span>${n[2]}</button>`).join('')}</nav>`}
function today(){let attention=S.notifications.filter(z=>z.urgent).slice(0,3);return `${header('One place to move everything forward.','Your next decisions, active productions and opportunities — without hunting through menus.',`${b('＋ Capture idea','idea','btn')}${b('↗ Start a post','publish-compose','btn primary')}`,'Tuesday · November 3')}<div class="hero"><div><div style="font-size:11px;letter-spacing:1.3px;color:#c2e2d0;font-weight:800">TODAY’S FOCUS</div><h2>Good work is moving. Here’s what needs you.</h2><p>Prioritize the next action. Background jobs and existing integrations keep running independently of this screen.</p><div class="hero-cta">${b('Open my work queue','nav-tasks','btn')}${b('Review alerts','nav-notifications','btn')}</div></div><div class="right-kpi"><big>${S.tasks.filter(z=>!z.done).length}</big><div style="font-size:12px;color:#c8dfd1">open actions</div></div></div><div class="kpi-band" style="margin:17px 0"><div class="metric"><span>Active projects</span><strong>4</strong><small class="muted">1 ready for review</small></div><div class="metric"><span>Posts in pipeline</span><strong>${S.posts.length}</strong><small class="muted">Across channels</small></div><div class="metric"><span>Opportunities</span><strong>2</strong><small class="muted">1 needs your decision</small></div><div class="metric"><span>Attention items</span><strong>${S.notifications.filter(z=>z.urgent).length}</strong><small class="muted">Connection, financial, media</small></div></div><div class="grid g-2" style="grid-template-columns:minmax(0,1.22fr) minmax(0,.78fr)"><div class="stack"><div class="panel pad"><div class="panel-head"><div class="section-title">Needs your decision</div>${b('View all notifications','nav-notifications','textlink')}</div>${attention.map(n=>`<div class="rowitem"><span class="circle">${n.type==='Business'?'♧':n.type==='Connection'?'⌁':'◉'}</span><div class="grow"><div class="rowtitle">${n.t}</div><div class="rowmeta">${n.d}</div></div>${b('Review',`nav-${n.go}`,'btn sm')}</div>`).join('')}</div><div class="panel pad"><div class="panel-head"><div class="section-title">Continue where you stopped</div>${b('Open production board','nav-projects','textlink')}</div><div class="grid g-2">${S.projects.slice(0,2).map(p=>`<div class="project-card"><img class="thumbnail" src="${IMG[p.img]}" alt="Illustrative ${E(p.name)} media"/><h4>${p.name}</h4><div class="small">${p.type} · ${p.stage}</div><div class="mini-progress" style="margin-top:11px"><span style="width:${p.progress}%"></span></div><div class="card-actions">${b('Continue',`project-${p.id}`,'btn sm dark')}${b('View assets',`project-assets-${p.id}`,'btn sm')}</div></div>`).join('')}</div></div></div><div class="stack"><div class="panel pad"><div class="panel-head"><div class="section-title">My tasks</div>${b('All tasks','nav-tasks','textlink')}</div>${S.tasks.filter(t=>!t.done).slice(0,4).map((t,i)=>`<div class="rowitem"><input aria-label="Complete ${E(t.t)}" type="checkbox" data-check-task="${S.tasks.indexOf(t)}" style="accent-color:#3e8b72"/><div class="grow"><div class="rowtitle">${E(t.t)}</div><div class="rowmeta">${t.tag} · ${t.due}</div></div>${b('Open',`nav-${t.go}`,'textlink')}</div>`).join('')}${b('＋ Add task','task','btn sm','style="margin-top:15px"')}</div><div class="panel pad"><div class="panel-head"><div class="section-title">Publishing next</div>${b('Full workspace','nav-publishing','textlink')}</div>${S.posts.slice(0,2).map(p=>`<div class="rowitem"><span class="circle">↗</span><div class="grow"><div class="rowtitle">${p.name}</div><div class="rowmeta">${p.platform} · ${p.time}</div></div>${pp(p.status,p.status==='Ready'?'ok':'warn')}</div>`).join('')}${b('Compose new post','publish-compose','btn primary sm','style="margin-top:14px"')}</div><div class="panel pad"><div class="panel-head"><div class="section-title">Studio & workers</div>${b('Open studio','nav-studio','textlink')}</div><div class="rowitem"><span class="circle">◉</span><div class="grow"><div class="rowtitle">RTX 3090</div><div class="rowmeta">Online · LTX job completed</div></div>${pp('Available','ok')}</div><div class="rowitem"><span class="circle">◉</span><div class="grow"><div class="rowtitle">RTX 3060</div><div class="rowmeta">Online · Worker connected</div></div>${pp('Idle','ok')}</div></div></div></div>`}
function notifications(){let items=S.notifications.filter(n=>S.alertFilter==='All activity'||(S.alertFilter==='Needs attention'?n.urgent:S.alertFilter===n.type));return `${header('Notifications & attention','See what changed, why it matters, and exactly where to act. Operational history is separate from your to-do list.',b('Notification preferences','nav-settings','btn'),'Operations center')}<div class="panel pad"><div class="chiprow" style="margin-bottom:16px">${['Needs attention','All activity','Business','Production','Finance','Publishing','Connection','System','Files'].map(q=>`<button class="chip ${S.alertFilter===q?'active':''}" data-alert="${q}">${q}</button>`).join('')}</div>${items.map(n=>`<div class="rowitem"><span class="circle">${n.type==='Finance'?'＄':n.type==='Production'?'◫':n.type==='Connection'?'⌁':n.type==='Business'?'♧':'◉'}</span><div class="grow"><div class="rowtitle">${n.t} &nbsp;${n.urgent?pp('Action needed','warn'):pp('FYI')}</div><div class="rowmeta">${n.d} · ${n.when}</div></div>${b('Open',`nav-${n.go}`,'btn sm')}${b('Dismiss',`dismiss-${n.id}`,'btn sm')}</div>`).join('')||'<div class="empty">Nothing in this filter.</div>'}</div><div class="notice" style="margin-top:14px">Design rule: successful background polls belong in run history, not an endless stream of alerts. Critical restore or integration errors must stay clearly visible.</div>`}
function tasks(){let current=getTab('tasks','To do');let list=current==='To do'?S.tasks.filter(t=>!t.done):current==='Recently done'?S.tasks.filter(t=>t.done):[];return `${header('Inbox & tasks','Priorities, follow-ups and Todo synchronization. You can work here without changing project structure.',b('＋ New task','task','btn primary'),'Personal action center')}${tab('tasks',['To do','Snoozed','Recently done','Todo sync'])}${current==='Todo sync'?`<div class="panel pad"><div class="section-title">Todo integration status</div><p class="sub">Pending, synced, conflict, failed and retry states remain distinct. Demo only; no live connection.</p>${b('Open integrations','nav-integrations','btn')}</div>`:current==='Snoozed'?`<div class="panel pad"><div class="empty">Snoozed actions show here, with wake-up time and source context.</div></div>`:`<div class="panel pad"><div class="panel-head"><div class="section-title">${current} · ${list.length}</div>${pp('Source-aware actions')}</div>${list.map(t=>`<div class="rowitem"><input type="checkbox" data-check-task="${S.tasks.indexOf(t)}" ${t.done?'checked':''}/><div class="grow"><div class="rowtitle">${E(t.t)}</div><div class="rowmeta">${t.tag} · ${t.due} · Linked to source record</div></div>${b('Open',`nav-${t.go}`,'btn sm')}${b('Snooze','demo-snooze','btn sm')}</div>`).join('')||'<div class="empty">No items to display.</div>'}</div>`}`}
function content(){let idea=S.ideas[S.selectedIdea]||S.ideas[0];return `${header('Content playground','An intentionally unstructured space for ideas, lyrics, links, rough notes and experiments. Nothing becomes a project until you decide.',`${b('＋ Capture idea','idea','btn primary')}${b('Templates','content-templates','btn')}`,'Creative sandbox · separate from Production')}<div class="grid" style="grid-template-columns:minmax(0,1.8fr) minmax(0,1fr)"><div class="panel pad"><div class="panel-head"><div><div class="section-title">Your idea wall</div><div class="small" style="margin-top:5px">Explore before committing. Select any note to refine it.</div></div>${pp(`${S.ideas.length} ideas`)}</div><div class="stickyboard">${S.ideas.map((x,i)=>`<div class="sticky" tabindex="0" role="button" data-idea="${i}"><div><div style="font-size:10px;opacity:.7;margin-bottom:9px">${x.tag}</div><h4>${E(x.name)}</h4><p>${E(x.body.slice(0,125))}${x.body.length>125?'…':''}</p></div><div style="font-size:10px;opacity:.75">Idea · Score ${x.score} / 10</div></div>`).join('')}<button data-action="idea" style="min-height:190px;border:2px dashed #c5d6c6;border-radius:12px;color:#6e8675;background:#f7fbf5;font-size:21px">＋<div style="font-size:12px;margin-top:8px">Another thought</div></button></div></div><div class="note-edit"><div class="column-title">SELECTED IDEA</div><div class="form-group"><label class="form-label">Working title</label><input class="field" id="edit-idea-name" value="${E(idea.name)}" /></div><div class="form-group"><label class="form-label">Free-form notes</label><textarea class="field fieldarea" id="edit-idea-body" style="min-height:220px">${E(idea.body)}</textarea><div class="hint">Messy is welcome. Drafts can remain unfinished.</div></div><div class="grid g-2"><div class="form-group"><label class="form-label">Category / pillar</label><input class="field" id="edit-idea-tag" value="${E(idea.tag)}"/></div><div class="form-group"><label class="form-label">Score</label><select class="field" id="edit-idea-score">${[5,6,7,8,9,10].map(n=>`<option value="${n}" ${idea.score===n?'selected':''}>${n}/10</option>`).join('')}</select></div></div><div class="form-group"><label class="form-label">Audience / language / channel</label><input class="field" placeholder="Optional — rough thoughts are enough"/></div><div class="file-action">${b('Save idea','save-idea','btn dark')}${b('Convert to project','convert-idea','btn primary')}</div><div class="notice" style="margin-top:14px">Converting is explicit and keeps the backlink. An idea is never automatically moved into Production.</div></div></div>`}
function projects(){return `${header('Production','Your project pipeline, stages, scenes, checklists and approved final selections.',`${b('Board / List','toggle-project-view','btn')}${b('＋ New project','project-new','btn primary')}`,'Production management')}<div class="chiprow" style="margin-bottom:18px">${['all','Music','Travel','Brand'].map(x=>`<button class="chip ${S.projectFilter===x?'active':''}" data-projectfilter="${x}">${x==='all'?'All projects':x}</button>`).join('')}</div><div class="kanban">${['Draft','Planning','In production','Review','Ready'].map(stage=>`<div class="kan-col"><h3>${stage}<span class="muted">${S.projects.filter(p=>p.stage===stage).length}</span></h3>${S.projects.filter(p=>p.stage===stage&&(S.projectFilter==='all'||p.type.toLowerCase().includes(S.projectFilter.toLowerCase())||(S.projectFilter==='Brand'&&p.id==='hotel'))).map(p=>`<div class="kan-card" data-project="${p.id}"><img class="thumbnail" src="${IMG[p.img]}" alt="${E(p.name)} visual"/><h4>${p.name}</h4><div class="small">${p.type}</div><div class="mini-tags">${pp(p.due==='—'?'No due date':p.due)}${pp(`${p.progress}%`)}</div><div class="mini-progress" style="margin-top:11px"><span style="width:${p.progress}%"></span></div></div>`).join('')||`<div class="empty" style="padding:20px 8px">No projects in this stage</div>`}</div>`).join('')}</div><div class="notice">Drag-to-change-stage and required checklist gates must be preserved during implementation. This concept displays the pipeline without modifying real stage records.</div>`}
function projectDetail(){let p=S.projects.find(x=>x.id===S.selectedProject)||S.projects[0];let curr=getTab('projectDetail','Overview');return `${header(p.name,`${p.type} · ${p.stage} · Due ${p.due}`,`${b('← Production','nav-projects','btn')}${b('Open Studio','nav-studio','btn')}${b('Prepare post','publish-from-project','btn primary')}`,'Project workspace')}<div class="grid" style="grid-template-columns:250px minmax(0,1fr)"><div class="panel pad"><img class="thumbnail" src="${IMG[p.img]}" alt="Project concept media"/><h3 style="margin:14px 0 3px">${p.name}</h3><div class="small">Project progress</div><div class="progress-rail" style="margin:11px 0"><div style="width:${p.progress}%"></div></div><div class="statusline">Stage ${pp(p.stage)}</div><div class="statusline">Scenes <b>5</b></div><div class="statusline">Due date <b>${p.due}</b></div><div class="statusline">Approved final <b>Pending</b></div></div><div class="panel pad">${tab('projectDetail',['Overview','Scenes','Checklist','Assets','Publishing','History'])}${curr==='Overview'?`<div class="section-title">One project, continuous context</div><p class="sub">Plan scenes, create clips, select finals, attach files and prepare publishing variants here. Global workspaces remain independently accessible.</p><div class="grid g-3" style="margin-top:20px">${[['Scenes','5 clips','project-scenes'],['Files','3 linked','project-assets'],['Publishing','2 variants','publish-from-project']].map(x=>`<div class="metric"><span>${x[0]}</span><strong style="font-size:20px">${x[1]}</strong>${b('Open',x[2],'textlink')}</div>`).join('')}</div>`:curr==='Scenes'?`<div class="section-title">Scene versions</div>${['Arrival establishing shot','Beach walk close-up','Studio lip-sync','Final hero shot'].map((x,i)=>`<div class="rowitem"><span class="circle">${i+1}</span><div class="grow"><div class="rowtitle">${x}</div><div class="rowmeta">Version ${i+1} · ${i===3?'Awaiting final approval':'Needs review'}</div></div>${b('Open Studio','nav-studio','btn sm')}</div>`).join('')}`:curr==='Checklist'?`<div class="section-title">Release readiness</div><p class="hint">Mandatory items block Ready unless an explicit override is recorded.</p>${['Concept approved','Reference assets linked','Final video approved','Platform metadata ready','Owner confirmation'].map((x,i)=>`<label class="checkline"><input type="checkbox" ${i<2?'checked':''}/> ${x} ${i>1?pp('Required','warn'):''}</label>`).join('')}`:curr==='Assets'?`<div class="section-title">Linked project assets</div><div class="grid g-3" style="margin:15px 0">${S.assets.slice(0,3).map(a=>`<div class="asset" data-asset="${a.id}"><img class="thumbnail" src="${IMG[a.src]}"/><h4>${a.name}</h4><div class="small">${a.device}</div></div>`).join('')}</div>${b('Open full Library','nav-library','btn')}`:curr==='Publishing'?`<div class="section-title">Project publishing targets</div><p class="sub">Account-specific variants, schedules and file associations stay linked to this project.</p>${b('Open full Publishing workspace','publish-from-project','btn primary')}`:`<div class="section-title">Decision history</div><p class="sub">Stage changes, selected final, checklist overrides and linked assets stay auditable.</p>`}</div></div>`}
function studio(){let type=getTab('studio','LTX Video');let isHistory=type==='History';let isSettings=type==='Settings';return `${header('Create Studio','Your working ComfyUI generation workflows, connected PCs and output history. The production controls live in a focused dark workspace.',`${b('View file library','nav-library','btn')}${b('Open production','nav-projects','btn')}`,'AI production · backend unchanged')}<div class="studio-wrap"><div class="studio-top"><div class="studio-tabs">${['LTX Video','MiniMax H3','Audio','History','Settings'].map(x=>`<button class="studio-tab ${x===type?'active':''}" data-tabpage="studio" data-tab="${x}">${x}</button>`).join('')}</div><div style="display:flex;gap:8px;align-items:center"><span style="color:#9fcbb5;font-size:11px">● Workers online</span>${pp('Existing workflows','ok')}</div></div>${isHistory?`<div style="padding:22px"><h3>Generation history</h3>${S.queue.map(x=>`<div class="dark-stat" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>${x}</b><small>Assigned to selected PC · Demo data</small></div><div class="file-action">${b('Preview','demo-preview','btn sm')}${b('Download sample info','download-demo','btn sm')}${b('Use in LTX','studio-ltx','btn sm')}</div></div>`).join('')}</div>`:isSettings?`<div style="padding:22px"><h3>PC connection settings</h3><div class="grid g-2"><div class="dark-stat"><b>RTX 3090 — endpoint</b><small>Existing configured ComfyUI address is preserved</small></div><div class="dark-stat"><b>RTX 3060 — endpoint</b><small>Existing configured ComfyUI address is preserved</small></div><div class="dark-stat"><b>Windows scheduled task</b><small>Only the named configured task can be queried, ended or started</small></div></div>${b('Open device diagnostics','nav-devices','btn sm')}</div>`:`<div class="studio-body"><div class="studio-col"><div class="form-group"><label class="form-label">Project</label><select class="field" id="studio-project">${S.projects.map(p=>`<option>${p.name}</option>`).join('')}</select></div><div class="form-group"><label class="form-label">Generate on</label><select class="field" id="studio-worker"><option>RTX 3090 · 24GB · Available</option><option>RTX 3060 · 12GB · Available</option></select></div><div class="form-group"><label class="form-label">${type==='Audio'?'Text to speak':type==='MiniMax H3'?'Main motion instructions':'Video prompt'}</label><textarea class="field fieldarea" id="studio-prompt" placeholder="Describe the motion, camera framing, and consistency requirements…" style="min-height:112px"></textarea></div><div class="form-group"><label class="form-label">Reference media</label><label class="upload-zone" style="display:block;background:#22302f;border-color:#4d635c;color:#dbe6dd"><input type="file" id="studio-file" style="display:none"/><div>＋ Add local file</div><div style="font-size:10px;margin-top:6px">or choose indexed Library media</div></label><div class="hint" id="studio-upload-name">${S.uploadName?E(S.uploadName):'No demo file selected'}</div>${b('Choose from Library','choose-library','btn sm','style="margin-top:8px"')}</div>${type==='MiniMax H3'?`<div class="form-group"><label class="form-label">H3 segments (up to 8)</label><select class="field"><option>4 connected motion segments</option><option>1 segment</option><option>8 segments</option></select></div>`:type==='LTX Video'?`<div class="form-group"><label class="form-label">Resolution</label><select class="field"><option>720 × 1280 · Vertical</option><option>1280 × 720 · Horizontal</option><option>Custom resolution</option></select></div>`:`<div class="form-group"><label class="form-label">Voice reference</label><select class="field"><option>Mehak reference clips</option><option>Library file</option></select></div>`}<details><summary style="font-size:11px;color:#b4c9be;cursor:pointer">Advanced parameters & existing workflow settings</summary><div class="form-group" style="margin-top:12px"><label class="form-label">LoRA / workflow parameters</label><input class="field" placeholder="Existing configured values" /></div></details>${b(S.offline?'Generation unavailable offline':'Generate · demo only','demo-generate','btn studio-btn','style="margin-top:17px;width:100%"'+(S.offline?' disabled':''))}</div><div class="studio-preview"><div style="display:flex;justify-content:space-between"><strong style="font-size:13px">${type==='Audio'?'Audio output':type==='MiniMax H3'?'H3 multitrack preview':'Generation preview'}</strong><span class="small" style="color:#9fb1a7">Project output</span></div><div class="studio-screen"><img src="${IMG[ S.selectedProject==='tika'?'studio':'cancun']}" alt="Illustrative media preview"/><span class="playbubble">▷</span></div><div class="timeline">${Array.from({length:type==='MiniMax H3'?8:5},(_,i)=>'<i></i>').join('')}</div><div class="file-action">${b('View History','studio-history','btn sm')}${b('Open in Library','nav-library','btn sm')}${b('Prepare publishing','publish-from-project','btn sm')}</div><div class="hint" style="color:#9fafaa">Actual rendered media stays on the selected PC. Demo preview only.</div></div><div class="studio-col"><div style="font-size:12px;font-weight:750;margin-bottom:13px">Execution & outputs</div><div class="dark-stat"><b>RTX 3090</b><small>Online · Available · 24GB</small></div><div class="dark-stat"><b>RTX 3060</b><small>Online · Available · 12GB</small></div><div class="dark-stat"><b>LTX workflow</b><small>Running in your real installation (per your confirmation)</small></div><div class="dark-stat"><b>Job safety</b><small>Manual Run only · Worker-specific inputs</small></div><div style="font-size:11px;color:#aebdb9;margin-top:20px">File playback and original downloads depend on the generating PC being online.</div></div></div>`}</div>`}
function library(){let t=getTab('library','Assets');let items=S.assets;return `${header('Media Library','Find, inspect, link, stream and download indexed files without losing their device location.',`${b('Upload media','upload','btn primary')}${b('Storage devices','nav-devices','btn')}`,'Assets · Files · Duplicates')}${tab('library',['Assets','Files','Duplicates'])}<div class="panel pad"><div class="panel-head"><div class="file-action"><select class="field" style="width:auto;min-width:140px"><option>All types</option><option>Video</option><option>Image</option><option>Audio</option></select><select class="field" style="width:auto;min-width:160px"><option>All devices</option><option>RTX 3090</option><option>RTX 3060</option><option>Offline</option></select></div><div class="file-action">${b('▦ Grid','grid','btn sm')}${b('☷ List','list','btn sm')}${b('Copy path','demo-copy','btn sm')}</div></div>${t==='Duplicates'?`<div class="notice">Near-duplicate hints are suggestions only. Fingerprints, physical file locations and manual confirmation remain distinct. Files are never merged automatically.</div><div class="rowitem"><span class="circle">≋</span><div class="grow"><div class="rowtitle">2 similar filenames detected</div><div class="rowmeta">Same name is not proof of an identical file.</div></div>${b('Inspect candidates','demo-duplicates','btn sm')}</div>`:S.gridMode==='grid'?`<div class="asset-grid">${items.map(a=>`<div class="asset" data-asset="${a.id}"><img class="thumbnail" src="${IMG[a.src]}" alt="Illustrative preview for ${E(a.name)}"/><h4>${a.name}</h4><div class="asset-meta"><span>${a.kind} · ${a.size}</span><span>${a.device}</span></div><div class="mini-tags">${pp(a.availability,a.availability==='Online'?'ok':'warn')}</div></div>`).join('')}</div>`:`<div>${items.map(a=>`<div class="rowitem"><img class="preview-thumb" src="${IMG[a.src]}"/><div class="grow"><div class="rowtitle">${a.name}</div><div class="rowmeta">${a.device} · ${a.kind} · ${a.size}</div></div>${b function analytics(){return `${header('Analytics & growth','Performance by platform, brand and period with verified metrics distinguished from manual entries.',b('Export demo CSV','demo-csv','btn primary'),'Performance intelligence')}<div class="kpi-band"><div class="metric"><span>Views · verified</span><strong>1.2M</strong><small class="muted">Illustrative</small></div><div class="metric"><span>Scheduled posts</span><strong>12</strong></div><div class="metric"><span>Paid invoices</span><strong>CAD 1.2k</strong></div><div class="metric"><span>Goal progress</span><strong>64%</strong></div></div><div class="grid g-2" style="margin-top:17px"><div class="panel pad"><div class="panel-head"><div class="section-title">Content performance</div>${pp('Platform-confirmed','ok')}</div><div class="chartbars">${[44,78,62,93,66,86,100].map((n,i)=>`<div class="bar-col"><div class="bar" style="height:${n}%"></div><div class="bar-label">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</div></div>`).join('')}</div></div><div class="panel pad"><div class="section-title">Goals & accountability</div>${['Increase qualified YouTube watch time','Grow original music releases','Build travel brand pipeline'].map((x,i)=>`<div style="margin:17px 0"><div class="statusline"><span>${x}</span><b>${[64,45,78][i]}%</b></div><div class="progress-rail"><div style="width:${[64,45,78][i]}%"></div></div></div>`).join('')}<div class="notice">Manually entered metrics and platform-verified data remain separately labeled.</div></div></div>`}
function channels(){return `${header('Channels, brands & accounts','Your brand hierarchy and separate connected identities, without merging historical data.',b('＋ Add brand','demo-brand','btn primary'),'Account structure')}<div class="grid g-3">${[['Mehak Thakur','Creator identity','Instagram · YouTube · Facebook'],['Mehak Escapes Daily','Travel & lifestyle','Instagram · YouTube'],['Mehak Fitness','Fitness content','Instagram']].map(x=>`<div class="panel pad"><span class="circle" style="margin-bottom:12px">◈</span><h3 style="font-size:16px;margin:0">${x[0]}</h3><p class="sub">${x[1]}</p><div class="divider"></div><div class="rowmeta">${x[2]}</div><div class="file-action" style="margin-top:14px">${b('Edit channels','demo-brand','btn sm')}${b('Account connections','nav-integrations','btn sm')}</div></div>`).join('')}</div><div class="notice" style="margin-top:16px">Archiving preserves historical posts, projects and deals. Accounts from different channels remain distinct.</div>`}
function devices(){return `${header('Storage & devices','Remote file scanners, media locations, pairing, agent heartbeats and GPU worker health.',b('Pair a device · demo','demo-pair','btn primary'),'System operations')}${tab('devices',['Devices','Indexed folders','Scanner activity','Worker health'])}<div class="grid g-2"><div class="panel pad"><div class="panel-head"><div class="section-title">RTX 3090 · Windows</div>${pp('Online','ok')}</div><div class="statusline">GPU <b>24 GB</b></div><div class="statusline">Scanner heartbeat <b>Connected</b></div><div class="statusline">Indexed folders <b>4</b></div><div class="file-action" style="margin-top:16px">${b('Scan now · demo','demo-scan','btn sm')}${b('Folder settings','demo-folder','btn sm')}</div></div><div class="panel pad"><div class="panel-head"><div class="section-title">RTX 3060 · Windows</div>${pp('Online','ok')}</div><div class="statusline">GPU <b>12 GB</b></div><div class="statusline">Scanner heartbeat <b>Connected</b></div><div class="statusline">Indexed folders <b>2</b></div><div class="file-action" style="margin-top:16px">${b('Scan now · demo','demo-scan','btn sm')}${b('Task diagnostics','demo-task','btn sm')}</div></div></div><div class="notice" style="margin-top:17px">Scan does not modify files. Rename, move and delete are separate confirmed actions. Offline machines retain file records and last-seen information.</div>`}
function integrations(){return `${header('Integrations','Connection health, consent, sync intervals and specific next steps for every provider.',b('Connection diagnostics','demo-diagnostics','btn primary'),'System health')}${tab('integrations',['Connected','Needs setup','Sync activity'])}<div class="panel pad">${[['Gmail','Active','Every 5 min · Read/classify; sending separately authorized'],['Instagram','Needs attention','Token refresh / account permission'],['YouTube','Active','Uploads 30 min · Comments 15 min'],['Facebook Pages','Active','Messages and comments 15 min'],['Todo app','Active','Push/pull and conflict resolution'],['Postiz','Not configured','Optional publishing connector'],['Threads / TikTok','Restricted','Developer approval and permission dependent']].map(x=>`<div class="rowitem"><span class="circle">⌁</span><div class="grow"><div class="rowtitle">${x[0]}</div><div class="rowmeta">${x[2]}</div></div>${pp(x[1],x[1]==='Active'?'ok':x[1]==='Needs attention'?'danger':'warn')}${b('Details','demo-integration','btn sm')}</div>`).join('')}</div><div class="notice" style="margin-top:15px">Changing consent or reauthorizing an account is not part of a visual redesign. Provider statuses are illustrative.</div>`}
function settings(){let curr=getTab('settings','Workspace');return `${header('Settings & system','Workspace preferences, roles, security, backup verification and operations.',b('View integrations','nav-integrations','btn'),'Administration')}${tab('settings',['Workspace','Team','Reminders','Security','Backups','Demo data','System'])}<div class="panel pad">${curr==='Workspace'?`<div class="grid g-2"><div class="form-group"><label class="form-label">Workspace name</label><input class="field" value="CreatorOS"/></div><div class="form-group"><label class="form-label">Timezone</label><select class="field"><option>America/Vancouver</option><option>UTC</option></select></div><div class="form-group"><label class="form-label">Display currency</label><select class="field"><option>CAD</option><option>USD</option></select></div><div class="form-group"><label class="form-label">Offline preview (prototype only)</label><select class="field" id="offline-select"><option value="false" ${S.offline?'':'selected'}>Online</option><option value="true" ${S.offline?'selected':''}>Simulate offline PWA</option></select></div></div>${b('Save demo preferences','demo-save-draft','btn primary')}`:curr==='Backups'?`<div class="section-title">Backup & restore verification</div><div class="rowitem"><span class="circle">▣</span><div class="grow"><div class="rowtitle">Nightly data and attachments backup</div><div class="rowmeta">03:15 America/Vancouver · Original PC media excluded</div></div>${pp('Scheduled','ok')}</div><div class="rowitem"><span class="circle">◉</span><div class="grow"><div class="rowtitle">Weekly restore test</div><div class="rowmeta">Sunday 03:45 · Critical failure notice</div></div>${b('Inspect history','demo-diagnostics','btn sm')}</div>`:curr==='System'?`<div class="section-title">System health & diagnostics</div>${['Database','Queue worker','Agent heartbeats','Retries and dead letters','Audit log'].map(x=>`<div class="statusline">${x}${pp('Inspect','ok')}</div>`).join('')}${b('Export diagnostics · demo','demo-diagnostics','btn','style="margin-top:17px"')}`:`<div class="section-title">${curr}</div><p class="sub">This workspace must keep every existing control in the corresponding settings tab, including permissions, quiet hours, sessions, 2FA and demo-data safeguards.</p><div class="notice">Roles: Owner, Editor, Viewer. Permission checks must continue to apply in UI and API.</div>`}</div>`}
function more(){return `${header('All workspaces','Every primary function remains one tap away. “More” is a complete navigation destination, not a drawer.','','Mobile workspace hub')}<div class="mobile-tools">${NAV.filter(n=>!['today','content','projects','publishing'].includes(n[0])).map(n=>`<button class="mobile-tool" data-nav="${n[0]}"><span class="glyph">${n[1]}</span>${n[2]}</button>`).join('')}</div>`}
function page(){switch(S.page){case'today':return today();case'notifications':return notifications();case'tasks':return tasks();case'content':return content();case'projects':return projects();case'projectDetail':return projectDetail();case'studio':return studio();case'library':return library();case'assetDetail':return assetDetail();case'publishing':return publish();case'calendar':return calendar();case'collabs':return collabs();case'socials':return socials();case'workflows':return workflows();case'analytics':return analytics();case'channels':return channels();case'devices':return devices();case'integrations':return integrations();case'settings':return settings();case'more':return more();default:return today()}}
function quickModal(type){if(type==='new')return `<h2>What do you want to start?</h2><p class="sub">Fast capture only — major workflows open their own dedicated page.</p><div class="grid g-2" style="margin-top:20px">${[['✦','Capture an idea','idea'],['☑','Add a task','task'],['↗','Compose a post','publish-compose'],['♧','Log brand inquiry','inquiry'],['▦','New project','project-new'],['▧','Upload media','upload']].map(x=>`<button class="list-select" data-action="${x[2]}"><strong>${x[0]} ${x[1]}</strong></button>`).join('')}</div>`;if(type==='idea')return `<h2>Catch a thought</h2><p class="sub">Keep it rough. Nothing is required to become a project.</p><div class="form-group" style="margin-top:19px"><label class="form-label">Working title</label><input class="field" id="modal-title" placeholder="A new idea…" autofocus/></div><div class="form-group"><label class="form-label">Anything on your mind</label><textarea class="field fieldarea" id="modal-notes" placeholder="Notes, lyrics, links, fragments…"></textarea></div><div class="modalfoot">${b('Cancel','close','btn')}${b('Save to Content','submit-idea','btn primary')}</div>`;if(type==='task')return `<h2>New task</h2><p class="sub">Add to your action queue with its source context.</p><div class="form-group" style="margin-top:19px"><label class="form-label">Task</label><input class="field" id="modal-title" placeholder="What needs to happen?" autofocus/></div><div class="grid g-2"><div class="form-group"><label class="form-label">Due</label><select class="field" id="modal-due"><option>Today</option><option>Tomorrow</option><option>Next week</option></select></div><div class="form-group"><label class="form-label">Category</label><select class="field" id="modal-tag"><option>General</option><option>Business</option><option>Production</option><option>Publishing</option></select></div></div><div class="modalfoot">${b('Cancel','close','btn')}${b('Add task','submit-task','btn primary')}</div>`;if(type==='inquiry')return `<h2>Log an inquiry</h2><p class="sub">Manual intake complements automatic Gmail classification, without replacing it.</p><div class="form-group" style="margin-top:19px"><label class="form-label">Brand or contact</label><input id="modal-title" class="field" placeholder="Company / contact"/></div><div class="form-group"><label class="form-label">Email or thread link</label><input class="field" placeholder="Optional URL or reference"/></div><div class="form-group"><label class="form-label">Your notes</label><textarea class="field fieldarea" id="modal-notes" placeholder="Opportunity, rights, dates, deliverables…"></textarea></div><div class="modalfoot">${b('Cancel','close','btn')}${b('Save demo inquiry','demo-inquiry-submit','btn primary')}</div>`;if(type==='upload')return `<h2>Upload to a PC</h2><p class="sub">Original bytes go to an online machine's selected scanned folder. Indexing remains read-only.</p><div class="form-group" style="margin-top:18px"><label class="form-label">Destination device</label><select class="field"><option>RTX 3090 · Online</option><option>RTX 3060 · Online</option></select></div><div class="form-group"><label class="form-label">Target folder</label><select class="field"><option>CreatorOS / Incoming</option><option>ComfyUI / Input</option></select></div><label class="upload-zone" style="display:block"><input type="file" id="upload-file" style="display:none"/><strong>＋ Select file</strong><div class="hint" id="upload-choice">${S.uploadName?E(S.uploadName):'No file selected'}</div></label><p class="hint">No overwrites. The standalone prototype never transfers any bytes.</p><div class="modalfoot">${b('Cancel','close','btn')}${b('Simulate upload','demo-upload','btn primary')}</div>`;if(type==='project-new')return `<h2>New production project</h2><p class="sub">Create a project for work you have decided to produce. Keep unfinished ideas in Content.</p><div class="form-group" style="margin-top:19px"><label class="form-label">Project name</label><input class="field" id="modal-title" placeholder="Project title" autofocus/></div><div class="form-group"><label class="form-label">Type</label><select class="field" id="modal-type"><option>Music video</option><option>Travel reel</option><option>Brand campaign</option><option>Other</option></select></div><div class="modalfoot">${b('Cancel','close','btn')}${b('Create demo project','submit-project','btn primary')}</div>`;if(type==='new-deal')return `<h2>New collaboration deal</h2><p class="sub">Deals are separate from auto-qualified opportunities and auto-created Draft projects.</p><div class="form-group" style="margin-top:15px"><label class="form-label">Brand</label><input class="field" id="modal-title" placeholder="Brand or contact"/></div><div class="grid g-2"><div class="form-group"><label class="form-label">Value</label><input class="field" type="number" placeholder="0.00" /></div><div class="form-group"><label class="form-label">Currency</label><select class="field"><option>CAD</option><option>USD</option><option>INR</option></select></div></div><div class="form-group"><label class="form-label">Rights / deliverables / terms</label><textarea class="field fieldarea"></textarea></div><div class="modalfoot">${b('Cancel','close','btn')}${b('Save demo deal','demo-deal-create','btn primary')}</div>`;if(type==='review-publish')return `<h2>Review publishing</h2><p class="sub">This is a demonstration. No real social post will be uploaded or scheduled.</p><div class="step">Account: ${S.selectedPlatform}</div><div class="step">Video: ${S.assets.find(a=>a.id===S.publishAsset)?.name||'Selected media'}</div><div class="step">Schedule: 2026-11-05 19:00 America/Vancouver</div><div class="notice">Production must preserve the existing platform-specific confirmation, authorization and offline safeguards.</div><div class="modalfoot">${b('Cancel','close','btn')}${b('Simulate scheduling','demo-schedule','btn primary')}</div>`;if(type==='search')return `<h2>Search CreatorOS</h2><p class="sub">Use the keyboard or search for a workspace, project or content.</p><input class="field" id="search-input" placeholder="Search across work…" style="margin:19px 0" autofocus/><div id="search-results">${NAV.slice(0,12).map(x=>`<button class="search-result" data-nav="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`).join('')}</div>`;return `<h2>Prototype interaction</h2><p class="sub">This action is included to show where the original CreatorOS capability belongs. The standalone design has no production connection and cannot change your real data.</p><div class="modalfoot">${b('Close','close','btn primary')}</div>`}
function render(){let root=document.getElementById('root');root.innerHTML=`<div class="app">${sidebar()}<div class="main">${S.offline?'<div class="offline-banner">◉ Offline PWA simulation — drafts can be saved locally; generation, publishing, payment and file deletion are not queued.</div>':''}${topbar()}<main class="work">${page()}</main>${bottom()}</div></div>${S.modal?`<div class="modal-shade" id="shade"><div class="modal" role="dialog" aria-modal="true">${quickModal(S.modal)}</div></div>`:''}${S.toast?`<div class="toast" role="status">${E(S.toast)}</div>`:''}`;document.title=`CreatorOS v5 · ${NAV.find(x=>x[0]===S.page)?.[2]||'Workspace'}`}
function toast(msg){S.toast=msg;render();setTimeout(()=>{S.toast='';render()},3000)}
function openModal(m){S.modal=m;render()}
function close(){S.modal=null;render()}
function downloadDemo(){const a=S.assets.find(x=>x.id===S.selectedAsset)||S.assets.find(x=>x.id===S.publishAsset)||S.assets[0];let blob=new Blob([`CREATOROS V5 DESIGN PROTOTYPE\nSample download for ${a.name}\nThis is NOT an original media file and not connected to CreatorOS.`],{type:'text/plain'});let u=URL.createObjectURL(blob);let el=document.createElement('a');el.href=u;el.download='creatoros-demo-download-not-original.txt';el.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Sample information downloaded. Real originals are not accessible from this demo.')}
function action(v){if(v==='close')return close();if(v==='new'||['idea','task','inquiry','upload','new-deal','search','review-publish'].includes(v))return openModal(v);if(v.startsWith('nav-'))return go(v.slice(4));if(v.startsWith('project-assets-')){S.selectedProject=v.slice(15);S.tab.projectDetail='Assets';return go('projectDetail')}if(v.startsWith('project-')){S.selectedProject=v.slice(8);S.tab.projectDetail='Overview';return go('projectDetail')}if(v.startsWith('asset-')){S.selectedAsset=v.slice(6);return go('assetDetail')}if(v==='convert-idea'){let idea=S.ideas[S.selectedIdea];S.projects.push({id:'idea'+Date.now(),name:idea.name,type:'Creative concept',stage:'Draft',due:'—',img:'studio',progress:5});toast('Demo project created with backlink to original idea.');return}if(v==='save-idea'){let n=document.getElementById('edit-idea-name'),note=document.getElementById('edit-idea-body'),tag=document.getElementById('edit-idea-tag'),score=document.getElementById('edit-idea-score');S.ideas[S.selectedIdea]={name:n.value,body:note.value,tag:tag.value,score:Number(score.value)};return toast('Idea updated in this demonstration.')}if(v==='submit-idea'){let n=document.getElementById('modal-title')?.value.trim(),note=document.getElementById('modal-notes')?.value||'';if(!n)return toast('Add an idea title first.');S.ideas.unshift({name:n,body:note,tag:'Unsorted',score:5});S.selectedIdea=0;S.modal=null;go('content');return toast('Idea saved in the local preview.')}if(v==='submit-task'){let n=document.getElementById('modal-title')?.value.trim();if(!n)return toast('Enter a task first.');S.tasks.unshift({t:n,tag:document.getElementById('modal-tag').value,due:document.getElementById('modal-due').value,go:'tasks',done:0});S.modal=null;go('tasks');return toast('Task added in this demonstration.')}if(v==='publish-compose'||v==='pub-compose'||v==='publish-from-project'||v==='publish-from-asset'){if(v==='publish-from-asset')S.publishAsset=S.selectedAsset;S.tab.publishing='Compose';return go('publishing')}if(v==='pub-matrix'){S.tab.publishing='Matrix';return go('publishing')}if(v==='studio-history'){S.tab.studio='History';return go('studio')}if(v==='studio-ltx'){S.tab.studio='LTX Video';return go('studio')}if(v==='choose-library')return go('library');if(v==='workflow-approvals'){S.tab.workflows='Approval queue';return go('workflows')}if(v==='workflow-rules'){S.tab.workflows='Rules';return go('workflows')}if(v==='social-unified'){S.tab.socials='Unified inbox';return go('socials')}if(v==='content-templates')return toast('Content templates stay in the separate Content workspace.');if(v==='project-scenes'){S.tab.projectDetail='Scenes';return render()}if(v==='project-assets'){S.tab.projectDetail='Assets';return render()}if(v==='toggle-stop'){S.workflowStop=!S.workflowStop;return toast(`Emergency stop ${S.workflowStop?'ON':'OFF'} (demo only).`)}if(v==='demo-generate'){if(S.offline)return toast('Generation is not available offline.');S.jobCount++;S.queue.unshift(`Demo job #${S.jobCount} · Queued (no actual GPU work)`);return toast('Simulated generation added to demo history; no GPU was contacted.')}if(v==='download-demo')return downloadDemo();if(v==='demo-save-draft'){S.drafts++;return toast('Saved locally in this prototype. No real post or message changed.')}if(v==='demo-schedule'){S.modal=null;S.posts.unshift({name:'New demo post',platform:S.selectedPlatform,status:'Scheduled',time:'Nov 5 · 7:00 PM'});S.tab.publishing='Queue';go('publishing');return toast('Demo schedule added. Nothing published.')}if(v==='grid'){S.gridMode='grid';return render()}if(v==='list'){S.gridMode='list';return render()}if(v==='project-new'){return openModal('project-new')}if(v==='submit-project'){let n=document.getElementById('modal-title')?.value.trim();if(!n)return toast('Enter a project name.');let type=document.getElementById('modal-type').value,id='project'+Date.now();S.projects.unshift({id,name:n,type,stage:'Draft',due:'—',img:'video',progress:0});S.modal=null;S.selectedProject=id;S.tab.projectDetail='Overview';go('projectDetail');return toast('Demo production project created.')}if(v==='demo-upload'){let name=document.getElementById('upload-file')?.files?.[0]?.name||S.uploadName;if(!name)return toast('Choose a sample file first.');S.modal=null;return toast(`Selected ${name}; no bytes uploaded to any PC.`)}if(v==='demo-csv'){let csv='platform,views,source\nYouTube,4800,illustrative\nInstagram,6900,illustrative';let u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));let a=document.createElement('a');a.href=u;a.download='creatoros-demo-analytics.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return toast('Downloaded a demo CSV.')}if(v.startsWith('dismiss-')){S.notifications=S.notifications.filter(n=>n.id!==Number(v.slice(8)));return render()}if(v==='demo-inquiry-submit'){S.modal=null;go('collabs');return toast('Inquiry noted in demonstration only.')}if(v==='demo-deal-create'){S.modal=null;go('collabs');S.tab.collabs='Deals';return toast('Demo deal recorded; no actual agreement sent.')}return openModal('generic')}
document.addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){let dest=n.dataset.nav;if(dest==='more')go('more');else go(dest);return}let a=e.target.closest('[data-action]');if(a){action(a.dataset.action);return}let tb=e.target.closest('[data-tabpage]');if(tb){S.tab[tb.dataset.tabpage]=tb.dataset.tab;render();return}let i=e.target.closest('[data-idea]');if(i){S.selectedIdea=Number(i.dataset.idea);render();return}let p=e.target.closest('[data-project]');if(p){S.selectedProject=p.dataset.project;S.tab.projectDetail='Overview';go('projectDetail');return}let asset=e.target.closest('[data-asset]');if(asset){S.selectedAsset=asset.dataset.asset;go('assetDetail');return}let m=e.target.closest('[data-mail]');if(m){S.selectedMail=Number(m.dataset.mail);render();return}let r=e.target.closest('[data-socialrow]');if(r){S.selectedRow=Number(r.dataset.socialrow);render();return}let pl=e.target.closest('[data-platform]');if(pl){S.selectedPlatform=pl.dataset.platform;render();return}let al=e.target.closest('[data-alert]');if(al){S.alertFilter=al.dataset.alert;render();return}let pf=e.target.closest('[data-projectfilter]');if(pf){S.projectFilter=pf.dataset.projectfilter;render();return}if(e.target.id==='shade')close()});
document.addEventListener('change',e=>{if(e.target.dataset.checkTask!==undefined){S.tasks[Number(e.target.dataset.checkTask)].done=e.target.checked;render()}if(e.target.id==='offline-select'){S.offline=e.target.value==='true';render();toast(S.offline?'PWA offline preview enabled':'PWA online preview enabled')}if(e.target.id==='studio-file'||e.target.id==='upload-file'){S.uploadName=e.target.files?.[0]?.name||'';let place=document.getElementById(e.target.id==='studio-file'?'studio-upload-name':'upload-choice');if(place)place.textContent=S.uploadName}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('search')}if(e.key==='Escape'&&S.modal)close();if(e.key==='Enter'&&e.target.dataset.idea!==undefined){S.selectedIdea=Number(e.target.dataset.idea);render()}});
document.addEventListener('input',e=>{if(e.target.id==='search-input'){let q=e.target.value.toLowerCase();document.getElementById('search-results').innerHTML=NAV.filter(x=>x[2].toLowerCase().includes(q)).map(x=>`<button class="search-result" data-nav="${x[0]}">${x[1]} &nbsp; ${x[2]}</button>`).join('')||'<div style="padding:20px" class="small">No workspace names match.</div>'}});
render();
</script></body></html>
